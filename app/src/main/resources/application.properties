spring.application.name=leetbrofinder
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=15m

leetbro.leetcode.endpoint=${LEETCODE_GRAPHQL_URL:https://leetcode.com/graphql}
leetbro.frontend-origins=${FRONTEND_ORIGINS:https://leetbrofinder.rmkrv.com,http://localhost:5173,http://127.0.0.1:5173}
leetbro.verification.ttl-minutes=15
leetbro.rate-limit.requests-per-minute=120
