services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leetbrofinder
      POSTGRES_USER: leetbro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or ignored .env file}
    ports:
      - "5433:5432"
    volumes:
      - leetbro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetbro -d leetbrofinder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leetbro-data:
